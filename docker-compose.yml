# PostgreSQL til lokal udvikling.
# docker-compose læser automatisk .env i samme mappe og indsætter ${...} herunder.
services:
  db:
    image: postgres:16
    container_name: dataleads-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bind kun til localhost — databasen skal ikke være tilgængelig fra netværket.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume => data overlever 'docker compose down' (men ikke 'down -v').
      - dataleads-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dataleads-pgdata:
