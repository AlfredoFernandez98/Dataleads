# DEV-profil. Læses kun når profilen 'dev' er aktiv.
# Alle DB-værdier kommer fra miljøvariabler (leveret af .env) — intet hardcodet.

# Indlæs .env som en properties-fil, hvis den findes (kun i dev).
# 'optional:' = fejl ikke hvis filen mangler.
# '[.properties]' = fortolk KEY=value-linjer som properties.
# Staging/prod bruger rigtige miljøvariabler i stedet.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ddl-auto=update: Hibernate opdaterer skemaet ud fra dine entities.
# Fint i dev — skifter til Flyway-styrede migreringer, så snart de første
# entities (og dermed migreringer i db/migration) findes.
spring.jpa.hibernate.ddl-auto=update

# CORS (ADR-0003): præcis Vite-dev-origin — aldrig '*', og slet ikke med credentials.
app.cors.allowed-origins=http://localhost:5173

# Log den SQL Hibernate kører — nyttigt mens man lærer.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
