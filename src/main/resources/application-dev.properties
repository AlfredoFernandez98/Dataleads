# DEV-profil. Læses kun når profilen 'dev' er aktiv.
# Alle DB-værdier kommer fra miljøvariabler (leveret af .env) — intet hardcodet.

# Indlæs .env som en properties-fil, hvis den findes (kun i dev).
# 'optional:' = fejl ikke hvis filen mangler.
# '[.properties]' = fortolk KEY=value-linjer som properties.
# Staging/prod bruger rigtige miljøvariabler i stedet.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway ejer skemaet — også i dev (ADR-0004): migreringerne i db/migration
# kører ved opstart, og Hibernate må kun VALIDERE at entities matcher skemaet.
# Dermed kan dev- og prod-skemaer ikke drifte fra hinanden.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# CORS (ADR-0003): præcis Vite-dev-origin — aldrig '*', og slet ikke med credentials.
app.cors.allowed-origins=http://localhost:5173

# Log den SQL Hibernate kører — nyttigt mens man lærer.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
