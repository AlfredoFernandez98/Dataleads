# PRODUCTION profile. Read only when profile 'prod' is active.
# All values come from environment variables — nothing hardcoded, no secrets in the repo.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# NEVER 'update' in prod — it can silently alter/drop columns.
# 'validate' only checks the schema matches entities; real changes go through Flyway (planned).
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
