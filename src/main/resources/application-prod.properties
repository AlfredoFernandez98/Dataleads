# PRODUCTION profile. Read only when profile 'prod' is active.
# All values come from environment variables — nothing hardcoded, no secrets in the repo.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Connection pool sizing (Hikari).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# NEVER 'update' in prod — it can silently alter/drop columns.
# 'validate' only checks the schema matches entities; real changes go through Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.show-sql=false

# Structured (ECS JSON) console logs for the log stack.
logging.structured.format.console=ecs

# CORS (ADR-0003): set the exact production frontend origin here — never '*'.
#app.cors.allowed-origins=https://app.example.dk
