# STAGING profile. Read only when profile 'staging' is active.
# Prod-like config; all values come from environment variables — nothing hardcoded.
# No default for DB_HOST: staging fails fast (like prod) if the env var is missing.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Connection pool sizing (Hikari).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Staging mirrors prod: don't let Hibernate mutate the schema.
# Schema changes go through Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Keep logs quieter than dev.
spring.jpa.show-sql=false

# Structured (ECS JSON) console logs for the log stack.
logging.structured.format.console=ecs

# CORS (ADR-0003): set the exact staging frontend origin here — never '*'.
#app.cors.allowed-origins=https://staging.example.dk
