spring.application.name=dataleads

# Aktiv profil. Kan overskrives med miljøvariablen SPRING_PROFILES_ACTIVE (fx i prod).
spring.profiles.active=dev

# Indlæs .env som en properties-fil, hvis den findes.
# 'optional:' = fejl ikke hvis filen mangler (fx i prod, hvor rigtige env-vars bruges).
# '[.properties]' = fortolk KEY=value-linjer som properties.
# Således ligger DB-hemmeligheder KUN i .env (som aldrig committes).
spring.config.import=optional:file:.env[.properties]
