spring.application.name=dataleads

# Der er med vilje INGEN default aktiv profil her: den pakkede app (jar) skal
# eksplicit sætte SPRING_PROFILES_ACTIVE (fx 'prod'). Lokal udvikling får 'dev'
# automatisk via spring-boot-maven-plugin i pom.xml ('./mvnw spring-boot:run').

# --- Actuator: eksponér kun health/info over HTTP ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Hardening (gælder alle profiler) ---
spring.jpa.open-in-view=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-stacktrace=never
server.error.include-message=never
