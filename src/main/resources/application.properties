spring.application.name=dataleads

# Der er med vilje INGEN default aktiv profil her: den pakkede app (jar) skal
# eksplicit sætte SPRING_PROFILES_ACTIVE (fx 'prod'). Lokal udvikling får 'dev'
# automatisk via spring-boot-maven-plugin i pom.xml ('./mvnw spring-boot:run').

# --- Actuator: eksponér kun health/info over HTTP ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- CVR-integration (ADR-0002): cvrapi.dk i MVP bag CvrClient-interfacet ---
# Valgfri gratis nøgle fra cvrapi.dk — tom = anonym (hårdere rate-limitet) adgang.
cvr.api-key=${CVR_API_KEY:}
# Øvrige defaults ligger i dk.dataleads.cvr.CvrProperties og kan overstyres her:
#   cvr.base-url=https://cvrapi.dk/api
#   cvr.country=dk
#   cvr.user-agent=Dataleads/0.1 (contact: af@zrm.dk)  <- cvrapi.dk KRÆVER beskrivende User-Agent
#   cvr.connect-timeout=2s
#   cvr.read-timeout=5s
#   cvr.max-retries=2
#   cvr.cache-refresh-days=30

# --- Hardening (gælder alle profiler) ---
spring.jpa.open-in-view=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-stacktrace=never
server.error.include-message=never
